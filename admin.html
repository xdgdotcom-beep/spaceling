<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Spaceling Designs</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FAFAF8;
  --off:      #F2F0EB;
  --ink:      #1A1916;
  --ink-soft: #3A3830;
  --mid:      #8C8880;
  --rule:     #E0DDD6;
  --accent:   #C8A86B;
  --green:    #3A6A3A;
  --green-lt: #F0F7F0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--ink); }
button { font-family: 'DM Sans', sans-serif; cursor: pointer; }

/* ── DASHBOARD LAYOUT ── */
#adminDash { min-height: 100vh; display: flex; }
.sidebar { width: 280px; background: var(--ink); color: var(--white); padding: 32px 0; display: flex; flex-direction: column; flex-shrink: 0; }
.brand { padding: 0 32px 32px; border-bottom: 1px solid rgba(250,250,248,0.1); margin-bottom: 24px; }
.brand-title { font-family: 'EB Garamond', serif; font-size: 1.4rem; letter-spacing: .05em; }
.brand-sub { font-size: .55rem; letter-spacing: .3em; text-transform: uppercase; color: var(--mid); margin-top: 4px; }
.nav-btn { display: block; width: 100%; text-align: left; padding: 16px 32px; background: none; border: none; color: var(--mid); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; transition: .3s; }
.nav-btn:hover { color: var(--white); background: rgba(250,250,248,0.05); }
.nav-btn.active { color: var(--accent); background: rgba(200,168,107,0.1); border-left: 3px solid var(--accent); }

.main-content { flex: 1; background: var(--off); padding: 48px; height: 100vh; overflow-y: auto; }
.panel { display: none; background: var(--white); border: 1px solid var(--rule); padding: 40px; max-width: 800px; }
.panel.active { display: block; }
.panel-title { font-family: 'EB Garamond', serif; font-size: 2rem; margin-bottom: 32px; border-bottom: 1px solid var(--rule); padding-bottom: 16px; }

/* ── FORMS & GRIDS ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.form-col-full { grid-column: span 2; }
.f-label { display: block; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: var(--mid); margin-bottom: 8px; }
.f-input { width: 100%; padding: 12px 14px; background: var(--off); border: 1px solid var(--rule); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: .86rem; outline: none; transition: border-color .3s; }
.btn-primary { padding: 14px 24px; background: var(--ink); border: none; font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--white); margin-top: 24px; }
.btn-primary:hover { background: var(--ink-soft); }
.msg-box { margin-bottom: 24px; font-size: .75rem; padding: 12px; display: none; }
.msg-err { background: #FDF0F0; color: #8B3030; border: 1px solid #E8C8C8; }
.msg-succ { background: var(--green-lt); color: var(--green); border: 1px solid #C8DFC8; }

/* ── CLIENT LIST ── */
.client-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
.client-card { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--off); border: 1px solid var(--rule); cursor: pointer; transition: .3s; }
.client-card:hover { border-color: var(--ink); }
.cc-name { font-weight: 500; font-size: .9rem; }
.cc-id { font-size: .65rem; color: var(--mid); margin-top: 4px; }
.cc-prog { font-family: 'EB Garamond', serif; font-size: 1.2rem; color: var(--accent); }

#editFormWrap { display: none; padding-top: 32px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>

<!-- DASHBOARD (Visible immediately) -->
<div id="adminDash">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-title">Spaceling</div>
      <div class="brand-sub">Admin Portal</div>
    </div>
    <button class="nav-btn active" onclick="switchPanel('create')">Create Client</button>
    <button class="nav-btn" onclick="switchPanel('manage')">Manage Clients</button>
  </div>

  <div class="main-content">
    
    <!-- CREATE CLIENT PANEL -->
    <div id="panel-create" class="panel active">
      <h2 class="panel-title">Create New Client</h2>
      <div id="createMsg" class="msg-box"></div>
      
      <div class="form-grid">
        <!-- Auth Credentials -->
        <div class="form-col-full"><h3 style="font-size:.75rem;text-transform:uppercase;color:var(--mid);letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px">1. Portal Login Credentials</h3></div>
        <div>
          <label class="f-label">Client Email (For Login)</label>
          <input class="f-input" id="newEmail" type="email" placeholder="client@example.com">
        </div>
        <div>
          <label class="f-label">Temporary Password</label>
          <input class="f-input" id="newPwd" type="text" placeholder="e.g. spaceling2026">
        </div>

        <!-- Project Details -->
        <div class="form-col-full" style="margin-top:16px"><h3 style="font-size:.75rem;text-transform:uppercase;color:var(--mid);letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:8px">2. Project Details</h3></div>
        <div>
          <label class="f-label">Client Name</label>
          <input class="f-input" id="newName" type="text" placeholder="e.g. Joji Family">
        </div>
        <div>
          <label class="f-label">Project ID</label>
          <input class="f-input" id="newPid" type="text" placeholder="e.g. SPC-2024-JF01">
        </div>
        <div class="form-col-full">
          <label class="f-label">Project Name / Title</label>
          <input class="f-input" id="newPName" type="text" placeholder="e.g. Joji Residence">
        </div>
        <div class="form-col-full">
          <label class="f-label">Location</label>
          <input class="f-input" id="newLoc" type="text" placeholder="e.g. Kootthattukulam, Kerala">
        </div>
      </div>
      <button class="btn-primary" onclick="createClient()">Generate Client Portal</button>
    </div>

    <!-- MANAGE CLIENTS PANEL -->
    <div id="panel-manage" class="panel">
      <h2 class="panel-title">Manage Projects</h2>
      
      <!-- List of clients -->
      <div id="clientList" class="client-list">
        <div style="font-size:.8rem;color:var(--mid)">Loading clients...</div>
      </div>

      <!-- Edit Form -->
      <div id="editFormWrap">
        <h3 style="font-size:1.2rem;margin-bottom:24px;font-family:'EB Garamond',serif">Update: <span id="editTitle"></span></h3>
        <div id="updateMsg" class="msg-box"></div>
        <input type="hidden" id="editUid">

        <div class="form-grid">
          <div>
            <label class="f-label">Progress Percentage (%)</label>
            <input class="f-input" id="editProg" type="number" min="0" max="100">
          </div>
          <div>
            <label class="f-label">Estimated Completion</label>
            <input class="f-input" id="editEst" type="text" placeholder="e.g. Nov 2025">
          </div>
          <div class="form-col-full">
            <label class="f-label">Main Status Label</label>
            <input class="f-input" id="editStatMain" type="text" placeholder="e.g. On Track / Delayed">
          </div>
          <div class="form-col-full">
            <label class="f-label">Sub-status / Current Phase</label>
            <input class="f-input" id="editStatSub" type="text" placeholder="e.g. Structural phase in progress">
          </div>
        </div>
        <button class="btn-primary" onclick="updateClientData()">Save Updates</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
  // ── FIREBASE IMPORTS ──
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  // ── FIREBASE CONFIGURATION ──
  const firebaseConfig = {
    apiKey: "AIzaSyAirsiW0j77XzbbUN7Lk4bf6zzpuUYhsUg",
    authDomain: "spaceling-data.firebaseapp.com",
    databaseURL: "https://spaceling-data-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "spaceling-data",
    storageBucket: "spaceling-data.firebasestorage.app",
    messagingSenderId: "318348426352",
    appId: "1:318348426352:web:ba83cf2d0e92849a4688b5",
    measurementId: "G-LY4T0667LY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Secondary Auth App (Used ONLY to create the client's login credentials silently)
  const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
  const secondaryAuth = getAuth(secondaryApp);

  // ── UI NAVIGATION ──
  window.switchPanel = function(panelName) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + panelName).classList.add('active');
  }

  function showMsg(elementId, text, isError = false) {
    const el = document.getElementById(elementId);
    el.style.display = 'block';
    el.textContent = text;
    el.className = isError ? 'msg-box msg-err' : 'msg-box msg-succ';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  // ── LOAD CLIENTS IMMEDIATELY ──
  let clientsData = {};
  
  function loadClients() {
    const dbRef = ref(db, 'projects');
    onValue(dbRef, (snapshot) => {
      const listEl = document.getElementById('clientList');
      listEl.innerHTML = ''; 
      document.getElementById('editFormWrap').style.display = 'none';

      if(snapshot.exists()) {
        clientsData = snapshot.val();
        for (const [uid, data] of Object.entries(clientsData)) {
          const card = document.createElement('div');
          card.className = 'client-card';
          card.innerHTML = `
            <div>
              <div class="cc-name">${data.clientName} — ${data.projectName}</div>
              <div class="cc-id">ID: ${data.projectId} &nbsp;·&nbsp; ${data.location}</div>
            </div>
            <div class="cc-prog">${data.progressPercent}%</div>
          `;
          card.onclick = () => openEditForm(uid, data);
          listEl.appendChild(card);
        }
      } else {
        listEl.innerHTML = '<div style="font-size:.8rem;color:var(--mid)">No clients found in database.</div>';
      }
    }, (error) => {
      document.getElementById('clientList').innerHTML = `<div style="color:#8B3030;font-size:.8rem;">Database Error: Permission Denied. Please check your Firebase Realtime Database Rules.</div>`;
    });
  }

  // Trigger on load
  loadClients();

  // ── CREATE NEW CLIENT ──
  window.createClient = async function() {
    const email = document.getElementById('newEmail').value.trim();
    const pwd = document.getElementById('newPwd').value.trim();
    const cName = document.getElementById('newName').value.trim();
    const pId = document.getElementById('newPid').value.trim();
    const pName = document.getElementById('newPName').value.trim();
    const loc = document.getElementById('newLoc').value.trim();

    if(!email || !pwd || !cName || !pId) {
      showMsg('createMsg', 'Please fill in all required fields.', true);
      return;
    }

    try {
      // 1. Create User Auth Credentials (so the client can log in)
      const userCred = await createUserWithEmailAndPassword(secondaryAuth, email, pwd);
      const newUid = userCred.user.uid;
      await signOut(secondaryAuth); // Sign out the dummy app immediately

      // 2. Create Database Entry
      const dbRef = ref(db, 'projects/' + newUid);
      const projectData = {
        clientName: cName,
        projectName: pName,
        location: loc,
        projectId: pId,
        progressPercent: 0,
        statusText: "Just Started",
        statusSubtext: "Design Phase Initiated",
        estimatedCompletion: "TBD",
        completionSubtext: "Pending schedule"
      };

      await set(dbRef, projectData);
      
      showMsg('createMsg', 'Client portal generated successfully!');
      
      // Clear form
      document.querySelectorAll('#panel-create input').forEach(input => input.value = '');

    } catch (e) {
      showMsg('createMsg', 'Error: ' + e.message, true);
    }
  }

  // ── EDIT CLIENT ──
  window.openEditForm = function(uid, data) {
    document.getElementById('editFormWrap').style.display = 'block';
    document.getElementById('editTitle').textContent = data.clientName + ' (' + data.projectId + ')';
    
    document.getElementById('editUid').value = uid;
    document.getElementById('editProg').value = data.progressPercent;
    document.getElementById('editEst').value = data.estimatedCompletion;
    document.getElementById('editStatMain').value = data.statusText;
    document.getElementById('editStatSub').value = data.statusSubtext;
    
    document.getElementById('editFormWrap').scrollIntoView({ behavior: 'smooth' });
  }

  window.updateClientData = async function() {
    const uid = document.getElementById('editUid').value;
    if(!uid) return;

    const updates = {
      progressPercent: parseInt(document.getElementById('editProg').value) || 0,
      estimatedCompletion: document.getElementById('editEst').value,
      statusText: document.getElementById('editStatMain').value,
      statusSubtext: document.getElementById('editStatSub').value
    };

    try {
      const dbRef = ref(db, 'projects/' + uid);
      await update(dbRef, updates);
      showMsg('updateMsg', 'Project updated successfully!');
    } catch (e) {
      showMsg('updateMsg', 'Failed to update: ' + e.message, true);
    }
  }
</script>
</body>
</html>
